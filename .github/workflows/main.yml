name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o "*.zip" -d extracted
          PROJECT_DIR=$(find extracted -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          find "$PROJECT_DIR" -name "build.gradle.kts" -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g; s/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +
          find "$PROJECT_DIR" -name "build.gradle" -exec sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g; s/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g" {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SW-Auto-Assistant-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
